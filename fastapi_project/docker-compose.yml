services:
  api:
    build: .
    container_name: fastapi_commandes_lws
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LWS_SMTP_HOST=mail.lws.fr
      - LWS_SMTP_PORT=465
      - LWS_SMTP_USE_SSL=true
      - LWS_SMTP_USER=contact@votredomaine.com
      - LWS_SMTP_PASSWORD=VotreMotDePasseEmailLWS
    volumes:
      - ./data:/app/data
